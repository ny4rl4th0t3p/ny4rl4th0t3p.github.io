name: pages

# Every push and pull request builds the site and checks its links; only main deploys.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch at a time, so a branch build never cancels a deploy from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Links within the site, section links included, checked offline: full https:// URLs are never fetched, so
      # another site being down can't fail the build. A folder link resolves to its index.html, as on GitHub Pages.
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline --include-fragments --index-files index.html --root-dir "$(pwd)/dist" --no-progress
            'dist/**/*.html'
          fail: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5